[project]
name = "raft-framework"
version = "0.1.0"
description = "Raft Framework — A Python web framework with hybrid routing, built on ASGI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Raft Contributors" },
]
keywords = ["web", "framework", "asgi", "rest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "python-decouple>=3.8",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "PyJWT>=2.8.0",
    "redis>=5.0.0",
    "click>=8.1",
    "rich>=13.0",
    "pyfiglet>=1.0.2",
    "watchfiles>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]
# RaftSQL + drivers (optional). Install when using the ORM:
#   uv sync --extra orm
orm = [
    "raftsql>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
raft = "raft.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tell hatchling which directory contains the Python package.
[tool.hatch.build.targets.wheel]
packages = ["raft"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
