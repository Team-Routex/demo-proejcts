services:
  # ============================================================================
  # PostgreSQL Database Service
  # ============================================================================
  db:
    image: postgres:17-alpine
    container_name: raft_blog_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-energy-pros}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-energy-pros}
      POSTGRES_DB: ${DB_NAME:-raft_blog}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-energy-pros} -d ${DB_NAME:-raft_blog}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - raft_network

  # ============================================================================
  # RaftFramework ASGI Backend Application
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: projects/backend/Dockerfile
    container_name: raft_blog_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_ENGINE=postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-energy-pros}
      - DB_PASSWORD=${DB_PASSWORD:-energy-pros}
      - DB_NAME=${DB_NAME:-raft_blog}
      - RAFT_SECRET_KEY=${RAFT_SECRET_KEY:-raft-super-secure-production-jwt-key-2026-distributed-consensus}
      - RAFT_CORS_ALLOWED_ORIGINS=${RAFT_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,*}
      - RAFT_ENV=production
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/projects/backend/uploads
    networks:
      - raft_network

volumes:
  postgres_data:
    name: raft_blog_postgres_data
  backend_uploads:
    name: raft_blog_uploads

networks:
  raft_network:
    name: raft_blog_network
    driver: bridge

